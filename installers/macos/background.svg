<svg xmlns="http://www.w3.org/2000/svg" width="660" height="420" viewBox="0 0 660 420">
  <!-- Clean white background -->
  <rect width="660" height="420" fill="#FFFFFF"/>

  <!-- Top-left Branding -->
  <g transform="translate(36, 32)">
    <!-- BC Launcher Icon -->
    <g transform="scale(2)">
      <defs>
        <clipPath id="bc_icon_clip">
          <rect width="14" height="14" rx="3.15"/>
        </clipPath>
      </defs>
      <g clip-path="url(#bc_icon_clip)">
        <rect width="14" height="14" fill="#F4F1EC"/>
        <g shape-rendering="crispEdges">
          <path fill="#8A5A3C" d="M2 3h3v1H2zM9 3h3v1H9zM0 4h2v2H0zM12 4h2v2h-2zM1 6h1v1H1zM12 6h1v1h-1zM5 4h1v3H5zM8 4h1v3H8zM2 7h3v1H2zM9 7h3v1H9z"/>
          <path fill="#FFFFFF" d="M2 4h3v3H2zM9 4h3v3H9z"/>
          <path fill="#A3A3A3" d="M6 5h2v1H6z"/>
          <path fill="#5E5E5E" d="M4 10h1v1H4zM9 10h1v1H9zM5 11h4v1H5z"/>
        </g>
      </g>
    </g>
    <!-- Wordmark -->
    <text x="38" y="21" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" fill="#23162A" letter-spacing="-0.3">BC Launcher</text>
  </g>

  <!-- Center Drag-and-Drop Arrow -->
  <g transform="translate(330, 210)">
    <path d="M -20 0 L 16 0 M 4 -12 L 18 0 L 4 12" fill="none" stroke="#000000" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
